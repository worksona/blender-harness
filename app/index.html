<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worlds</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <section id="gallery" hidden>
    <header>
      <h1>Worlds</h1>
      <p>Built in Blender, generated from code in <code>worlds/</code>.
        <a href="guide.html" class="guide-link">How to use the harness &rarr;</a></p>
    </header>
    <div id="grid"></div>
  </section>

  <section id="viewer" hidden>
    <canvas id="canvas"></canvas>
    <div class="hud top">
      <a href="#/" class="btn" title="All worlds (Esc)">&larr; Worlds</a>
      <div class="title"><h2 id="w-title"></h2><p id="w-desc"></p></div>
      <div class="actions">
        <button class="btn" id="b-prev" title="Previous world ([)">&lsaquo;</button>
        <button class="btn" id="b-next" title="Next world (])">&rsaquo;</button>
        <button class="btn" id="b-spin" title="Auto-rotate (R)">Spin</button>
        <button class="btn" id="b-twin" title="Data twin: records and test replay (T)" hidden>Twin</button>
        <button class="btn" id="b-light" title="Time of day and atmosphere (L)">Light</button>
        <button class="btn" id="b-reset" title="Reset view (0)">Reset</button>
      </div>
    </div>
    <form class="panel" id="light-panel" hidden>
      <div class="row head"><strong>Time of day</strong><output id="lp-clock">12:00</output>
        <button type="button" class="btn small" id="lp-play" title="Play through the day (space)">▶</button></div>
      <input type="range" id="lp-time" min="0" max="24" step="0.05" value="12" aria-label="Time of day">
      <div class="row"><label for="lp-season">Season</label>
        <select id="lp-season">
          <option value="355">Winter</option><option value="80">Spring</option>
          <option value="172" selected>Summer</option><option value="266">Autumn</option>
        </select>
        <label for="lp-lat">Latitude</label><output id="lp-lat-out">45°</output></div>
      <input type="range" id="lp-lat" min="-65" max="70" step="1" value="45" aria-label="Latitude">
      <div class="row"><label for="lp-haze">Haze</label><output id="lp-haze-out">0.30</output></div>
      <input type="range" id="lp-haze" min="0" max="1" step="0.01" value="0.3">
      <div class="row"><label for="lp-vis">Visibility</label><output id="lp-vis-out">auto</output></div>
      <input type="range" id="lp-vis" min="0" max="100" step="1" value="100" aria-label="Visibility">
      <div class="row"><label for="lp-ev">Exposure</label><output id="lp-ev-out">+0.0 EV</output></div>
      <input type="range" id="lp-ev" min="-3" max="3" step="0.1" value="0">
      <div class="row"><label for="lp-lamps">Lamps</label>
        <select id="lp-lamps"><option value="auto">Auto (dusk)</option><option value="on">On</option><option value="off">Off</option></select>
        <button type="button" class="btn small" id="lp-reset">World default</button></div>
      <p class="note" id="lp-status"></p>
    </form>
    <aside class="panel twin" id="twin-panel" hidden>
      <div class="row head">
        <button type="button" class="btn small" id="tw-back" hidden>&larr; All</button>
        <strong>Data twin</strong>
        <button type="button" class="btn small" id="tw-locate" hidden>Locate</button>
        <button type="button" class="btn small" id="tw-close" title="Close (T)">&times;</button>
      </div>
      <div id="tw-card"></div>
      <div id="tw-browse">
        <input type="search" id="tw-filter" placeholder="Filter: line, heat no., weld…" aria-label="Filter records">
        <div id="tw-list"></div>
        <p class="note">Click any object in the scene to open its record.</p>
      </div>
    </aside>
    <div id="twin-gauges"></div>
    <div class="replay" id="twin-replay" hidden>
      <button type="button" class="btn small" id="tr-play" title="Replay">▶</button>
      <select id="tr-series" aria-label="Series"></select>
      <div id="tr-readout"></div>
      <div id="tr-chart"></div>
    </div>
    <div class="hud bottom" id="w-stats"></div>
    <div id="loading">Loading…</div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
